<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Doge Learns JavaScript — Much Code Very Wow</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Cinematic background -->
  <div class="bg-gradient"></div>
  <div class="scanlines"></div>
  <div class="vignette"></div>

  <!-- Code typing overlay -->
  <div class="code-wrap">
    <pre id="code" class="code-block"></pre>
  </div>

  <!-- Doge stage -->
  <div id="stage" class="stage">
    <!-- Central doge avatar (emoji for zero assets) -->
    <div id="doge-main" class="doge">
      <span class="doge-face">🐶</span>
      <span class="doge-glasses">🕶️</span>
    </div>

    <!-- Shared wow counter HUD -->
    <div id="hud" class="hud">
      <div class="hud-title">WOW COUNTER</div>
      <div id="wow-count" class="hud-value">0</div>
    </div>

    <!-- Console readout (cinematic pulse) -->
    <div id="console" class="console">
      <div class="console-line">// Console</div>
      <div id="console-output" class="console-line"></div>
    </div>
  </div>

  <!-- Floating meme dreams -->
  <div class="meme-cloud">
    <span class="meme">such class</span>
    <span class="meme">much static</span>
    <span class="meme">very wow</span>
    <span class="meme">so instance</span>
    <span class="meme">many code</span>
    <span class="meme">wow wow wow</span>
    <span class="meme">pls no banana</span>
    <span class="meme">legendary doge</span>
  </div>

  <!-- Jetpack burners container -->
  <div id="particle-layer" class="particle-layer"></div>

  <script src="script.js"></script>
</body>
</html>
